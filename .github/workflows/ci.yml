name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund lighthouse@13.6.0 axe-core@4.14.1 puppeteer-core@25.18.1

      - name: Check responsive layouts, accessibility and transfer budget
        run: BROWSER_TOOLS="$RUNNER_TEMP/browser-tools" CHROME_PATH="$(which google-chrome)" node scripts/check-browser.mjs
