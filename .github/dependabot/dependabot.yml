name: Dependabot

on:
  schedule:
    - daily

pull_request_rules:
  # Auto-approve Dependabot version updates for dependencies scoped to this repo
  - conditions:
      - label:~dependencies
      - target_branch: main
    actions:
      - allow

  # Auto-merge safe dependency updates
  - conditions:
      - label:~dependencies
      - target_branch: main
      - does-not-contain-files: '**/package-lock.json'
    actions:
      - merge

publish:
  # Publish Dependabot alerts to Dependabot Security Updates
  - default: true
    dont_publish: false
