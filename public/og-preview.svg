  <text x="100" y="280" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#22D3EE" letter-spacing="2">AI ENGINEER · FULL-STACK DEVELOPER · SYSTEMS BUILDER</text>
  
  <text x="100" y="340" font-family="'Inter', sans-serif" font-size="24" fill="#A3AFC2">Computer Science &amp; Engineering · CBIT Hyderabad</text>
  <text x="100" y="375" font-family="'Inter', sans-serif" font-size="20" fill="#7E8B9F">PRAVAAH · TAPAS · SureStep · TRAFFIQ · VidyaVistaar</text>

