<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Left vertical pillar of N (Pure crisp white) -->
  <rect x="13" y="15" width="7" height="34" rx="2" fill="#FFFFFF"/>

  <!-- Diagonal stroke connecting N to R (Electric Cyan-Blue Accent) -->
  <path d="M17 16 L35 48 L41 48 L23 16 Z" fill="url(#accentGrad)"/>

  <!-- Right vertical stem / foundation of R (Pure crisp white) -->
  <rect x="33" y="15" width="7" height="34" rx="2" fill="#FFFFFF"/>

  <!-- Upper bowl of R -->
  <path d="M37 15 H44 C49.5 15 53 18.5 53 23.5 C53 28.5 49.5 32 44 32 H37 Z M40 21 V26.5 H43.5 C45.5 26.5 47 25.5 47 23.5 C47 21.5 45.5 20.5 43.5 20.5 Z" fill="#FFFFFF"/>

  <!-- Distinctive leg of R extending outward with dynamic cut -->
  <path d="M40 30.5 L49.5 49 H43 L35 32.5 Z" fill="#FFFFFF"/>

  <!-- Subtle electric blue status indicator dot -->
  <circle cx="50" cy="15" r="2.5" fill="#38BDF8"/>
</svg>
