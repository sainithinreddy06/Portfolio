[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API calls to Netlify functions if deployed to Netlify
[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/portfolio/resume"
  to = "/.netlify/functions/resume"
  status = 200

[[redirects]]
  from = "/api/github/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/github/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/github/status"
  to = "/.netlify/functions/status"
  status = 200

# SPA catch-all for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
